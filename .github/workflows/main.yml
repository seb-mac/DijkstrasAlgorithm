name: Remove Partial Scenes

on:
  - workflow_dispatch
  - push

jobs:
  remove-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: get ls
        run: ls -la
            
      - name: Show all matching files
        run: |
          rm  media/**/partial_movie_files/

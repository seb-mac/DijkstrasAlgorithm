name: Remove Partial Scenes

on:
  - workflow_dispatch
  - push

jobs:
  remove-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: get ls
        run: ls -la
            
      - name: Show all matching files
        run: |
          # Enable recursive globbing in Bash
          shopt -s globstar nullglob

          # Safety: list matches before deleting
          echo "Files to be deleted:"
          echo /media/**/partial_movie_files/*

          # Actually delete them
          rm -rf /media/**/partial_movie_files/*
